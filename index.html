<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scout ao Vivo">
<link rel="manifest" href="./manifest.webmanifest">
<title>Scout ao Vivo — Beta 3</title>
<style>
:root{--bg:#0f172a;--card:#172033;--line:#334155;--txt:#f8fafc;--muted:#aeb9c9;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--amber:#d97706;--purple:#7c3aed}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}
.wrap{max-width:850px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h1{font-size:21px;margin:0 0 10px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:white;font-size:16px}
.score{font-size:25px;font-weight:bold;white-space:nowrap}.clock{text-align:center;font-size:42px;font-weight:bold;margin:8px 0}
.period{text-align:center;color:var(--muted);font-weight:bold}.controls,.events,.footer{display:grid;gap:8px}
.controls{grid-template-columns:repeat(4,1fr)}.events{grid-template-columns:repeat(2,1fr)}.footer{grid-template-columns:repeat(3,1fr)}
button{border:0;border-radius:12px;padding:14px 8px;font-weight:bold;font-size:15px;color:white;background:#334155;min-height:52px;cursor:pointer}
button:active{transform:scale(.98)}.event{min-height:68px;font-size:16px}.green{background:var(--green)}.red{background:var(--red)}
.blue{background:var(--blue)}.amber{background:var(--amber)}.goal{background:var(--purple)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#0b1220;border-radius:9px;padding:8px;text-align:center;font-size:12px}
.stat b{display:block;font-size:21px}.history{max-height:210px;overflow:auto}.row{padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.small{font-size:12px;color:var(--muted)}.label{font-size:12px;color:var(--muted);font-weight:bold;margin-bottom:7px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle button{min-height:47px;background:#334155}
.toggle button.active{background:var(--green);outline:2px solid #86efac}.toggle button.pos-away.active{background:var(--red);outline:2px solid #fca5a5}
.moment-options{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.moment-options.show{display:grid}
.video{color:#fbbf24}.period-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.period-table th,.period-table td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}.period-table th:first-child,.period-table td:first-child{text-align:left}
@media(max-width:520px){.controls{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.clock{font-size:38px}}
</style>
</head>
<body><div class="wrap">
<div class="card">
<h1>⚽ SCOUT AO VIVO <span class="small">BETA 3</span></h1>
<div class="teams"><input id="home" value="Rio Claro"><div class="score"><span id="hs">0</span> × <span id="as">0</span></div><input id="away" value="Adversário"></div>

<div class="label" style="margin-top:12px">EQUIPE ANALISADA</div>
<div class="toggle">
<button id="anHome" class="active" onclick="setAnalyzed('home')">Rio Claro</button>
<button id="anAway" onclick="setAnalyzed('away')">Adversário</button>
</div>

<div class="label" style="margin-top:12px">POSSE DE BOLA</div>
<div class="toggle">
<button id="posHome" class="active" onclick="setPossession('home')">Rio Claro</button>
<button id="posAway" class="pos-away" onclick="setPossession('away')">Adversário</button>
</div>

<div class="clock" id="clock">00:00</div><div class="period" id="period">1º TEMPO</div>
<div class="controls" style="margin-top:10px">
<button class="green" onclick="start()">▶ INICIAR</button><button onclick="pause()">⏸ PAUSAR</button>
<button class="blue" onclick="nextPeriod()">2º TEMPO</button><button onclick="resetClock()">↺ ZERAR</button>
</div></div>

<div class="card"><div class="events">
<button class="event green" onclick="addAnalyzed('Recuperação')">🟢 RECUPERAÇÃO</button>
<button class="event red" onclick="addAnalyzed('Perda')">🔴 PERDA</button>
<button id="shotBtn" class="event blue" onclick="addImportantPossession('Finalização')">⚽ FINALIZAÇÃO</button>
<button class="event blue" onclick="addAnalyzed('Passe-chave')">🎯 PASSE-CHAVE</button>
<button class="event green" onclick="addAnalyzed('Transição ofensiva')">⬆ TRANS. OFENSIVA</button>
<button class="event red" onclick="addAnalyzed('Transição defensiva')">⬇ TRANS. DEFENSIVA</button>
<button class="event amber" onclick="addPossession('Bola parada')">🚩 BOLA PARADA</button>
<button class="event amber" onclick="toggleMoment()">★ MOMENTO</button>
<div id="momentOptions" class="moment-options" style="grid-column:1/-1">
<button class="green" onclick="addMoment('Momento ofensivo')">⬆ OFENSIVO</button>
<button class="red" onclick="addMoment('Momento defensivo')">⬇ DEFENSIVO</button>
</div>
<button id="goalBtn" class="event goal" style="grid-column:1/-1" onclick="goal()">⚽ GOL</button>
</div></div>

<div class="card"><b>CONTADORES</b><div id="stats" class="stats" style="margin-top:8px"></div></div>

<div class="card">
<b>EVOLUÇÃO POR BLOCOS DE 15'</b>
<div class="small" style="margin-top:5px">Atualização automática conforme os registros.</div>
<div id="periodBlocks"></div>
</div>

<div class="card"><b>ÚLTIMOS EVENTOS</b><div id="history" class="history"><div class="small" style="padding:8px">Nenhum evento registrado.</div></div></div>
<div class="footer">
<button onclick="undo()">↶ DESFAZER</button><button class="blue" onclick="downloadCSV()">💾 EXPORTAR CSV</button><button onclick="clearAll()">🗑 LIMPAR</button>
</div>
<div class="small" style="text-align:center;margin:10px">Finalização, Gol e Momento salvam também o início sugerido do vídeo 15s antes.</div>
</div>
<script>
let seconds=0,timer=null,period=1,events=[],analyzed='home',possession='home';
const types=['Recuperação','Perda','Finalização','Passe-chave','Transição ofensiva','Transição defensiva','Bola parada','Momento ofensivo','Momento defensivo','Gol'];

function teamName(key){return ((key==='home'?home.value:away.value)|| (key==='home'?'Casa':'Visitante')).trim()}
function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderClock(){clock.textContent=fmt(seconds);document.getElementById('period').textContent=period+'º TEMPO'}
function start(){if(!timer)timer=setInterval(()=>{seconds++;renderClock()},1000)}
function pause(){clearInterval(timer);timer=null}
function resetClock(){pause();seconds=0;renderClock()}
function nextPeriod(){pause();period=2;seconds=0;renderClock()}

function syncTeamLabels(){
 anHome.textContent=teamName('home'); anAway.textContent=teamName('away');
 posHome.textContent=teamName('home'); posAway.textContent=teamName('away');
 updatePossessionButtons();
}
home.addEventListener('input',syncTeamLabels);away.addEventListener('input',syncTeamLabels);

function setAnalyzed(key){
 analyzed=key;
 anHome.classList.toggle('active',key==='home');
 anAway.classList.toggle('active',key==='away');
 saveState();
}
function setPossession(key){
 possession=key;
 posHome.classList.toggle('active',key==='home');
 posAway.classList.toggle('active',key==='away');
 updatePossessionButtons();
 saveState();
}
function updatePossessionButtons(){
 shotBtn.innerHTML='⚽ FINALIZAÇÃO<br><span class="small" style="color:white">'+teamName(possession)+'</span>';
 goalBtn.innerHTML='⚽ GOL — '+teamName(possession);
}
function toggleMoment(){momentOptions.classList.toggle('show')}
function pushEvent(type,key,important=false){
 const videoStart=important?fmt(seconds-15):'';
 events.push({
   tempo:fmt(seconds),
   segundos:seconds,
   periodo:period+'ºT',
   periodo_num:period,
   evento:type,
   equipe:teamName(key),
   equipe_chave:key,
   inicio_video:videoStart
 });
 save();render();
}
function addAnalyzed(type){pushEvent(type,analyzed,false)}
function addPossession(type){pushEvent(type,possession,false)}
function addImportantPossession(type){pushEvent(type,possession,true)}
function addMoment(type){pushEvent(type,analyzed,true);momentOptions.classList.remove('show')}

function goal(){
 pushEvent('Gol',possession,true);
 if(possession==='home') hs.textContent=Number(hs.textContent)+1;
 else as.textContent=Number(as.textContent)+1;
 saveState();
}
function undo(){
 if(events.length){
   let e=events.pop();
   if(e.evento==='Gol'){
     if(e.equipe_chave==='home')hs.textContent=Math.max(0,Number(hs.textContent)-1);
     else as.textContent=Math.max(0,Number(as.textContent)-1);
   }
   save();render()
 }
}
function clearAll(){
 if(confirm('Apagar todos os eventos deste scout?')){
   events=[];hs.textContent=0;as.textContent=0;save();render()
 }
}
function render(){
 let c={};types.forEach(t=>c[t]=0);events.forEach(e=>c[e.evento]=(c[e.evento]||0)+1);
 let visible=['Recuperação','Perda','Finalização','Passe-chave','Transição ofensiva','Transição defensiva','Bola parada','Gol'];
 stats.innerHTML=visible.map(t=>`<div class="stat"><b>${c[t]||0}</b>${t}</div>`).join('');
 history.innerHTML=events.length?events.slice().reverse().map(e=>`<div class="row"><b>${e.tempo}</b> · ${e.periodo} · ${e.evento}<br><span class="small">${e.equipe}${e.inicio_video?` · <span class="video">vídeo desde ${e.inicio_video}</span>`:''}</span></div>`).join(''):'<div class="small" style="padding:8px">Nenhum evento registrado.</div>';
 renderBlocks();
}
function renderBlocks(){
 const metrics=['Recuperação','Perda','Finalização','Transição ofensiva','Transição defensiva','Gol'];
 const maxP=Math.max(period,...events.map(e=>e.periodo_num||1));
 let rows=[];
 for(let p=1;p<=maxP;p++){
   const pe=events.filter(e=>(e.periodo_num||1)===p);
   const maxSec=Math.max(p===period?seconds:0,...pe.map(e=>e.segundos||0),0);
   const blocks=Math.max(1,Math.ceil((maxSec+1)/900));
   for(let b=0;b<blocks;b++){
     const ini=b*900,fim=(b+1)*900;
     const be=pe.filter(e=>(e.segundos||0)>=ini&&(e.segundos||0)<fim);
     rows.push(`<tr><td>${p}ºT ${b*15}–${(b+1)*15}'</td>`+
       metrics.map(m=>`<td>${be.filter(e=>e.evento===m).length}</td>`).join('')+'</tr>');
   }
 }
 periodBlocks.innerHTML='<table class="period-table"><thead><tr><th>Bloco</th><th>Rec.</th><th>Perda</th><th>Fin.</th><th>T.Of.</th><th>T.Def.</th><th>Gol</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}
function save(){
 localStorage.setItem('scoutEventsBeta3',JSON.stringify(events));
 saveState();
}
function saveState(){
 localStorage.setItem('scoutStateBeta3',JSON.stringify({
   hs:hs.textContent,as:as.textContent,home:home.value,away:away.value,
   analyzed,possession,seconds,period
 }));
}
function load(){
 try{
   events=JSON.parse(localStorage.getItem('scoutEventsBeta3'))||[];
   let s=JSON.parse(localStorage.getItem('scoutStateBeta3'))||{};
   hs.textContent=s.hs||0; as.textContent=s.as||0;
   if(s.home)home.value=s.home;if(s.away)away.value=s.away;
   seconds=Number(s.seconds)||0;period=Number(s.period)||1;
   setAnalyzed(s.analyzed||'home');setPossession(s.possession||'home');
 }catch(e){}
 syncTeamLabels();render();renderClock();
}
function downloadCSV(){
 let rows=[['Tempo','Periodo','Evento','Equipe','Inicio_video_15s'],
 ...events.map(e=>[e.tempo,e.periodo,e.evento,e.equipe,e.inicio_video||''])];
 let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');
 let a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='scout_'+teamName(analyzed).replace(/\s+/g,'_')+'.csv';
 a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
load();
</script></body></html>
