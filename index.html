<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scout ao Vivo</title>
<style>
:root{--bg:#0f172a;--card:#172033;--line:#334155;--txt:#f8fafc;--muted:#aeb9c9;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--amber:#d97706}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}
.wrap{max-width:850px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h1{font-size:21px;margin:0 0 10px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
input{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:white;font-size:16px}
.score{font-size:25px;font-weight:bold;white-space:nowrap}.clock{text-align:center;font-size:42px;font-weight:bold;margin:8px 0}
.period{text-align:center;color:var(--muted);font-weight:bold}.controls,.events,.footer{display:grid;gap:8px}
.controls{grid-template-columns:repeat(4,1fr)}.events{grid-template-columns:repeat(2,1fr)}.footer{grid-template-columns:repeat(3,1fr)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;border:0;border-radius:12px;padding:14px 8px;font-weight:bold;font-size:15px;color:white;background:#334155;min-height:52px}
button:active{transform:scale(.98)}.event{min-height:68px;font-size:16px}.green{background:var(--green)}.red{background:var(--red)}
.blue{background:var(--blue)}.amber{background:var(--amber)}.goal{background:#7c3aed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#0b1220;border-radius:9px;padding:8px;text-align:center;font-size:12px}
.stat b{display:block;font-size:21px}.history{max-height:180px;overflow:auto}.row{padding:8px;border-bottom:1px solid var(--line);font-size:14px}
.small{font-size:12px;color:var(--muted)}@media(max-width:520px){.controls{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.clock{font-size:38px}}

.submenu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}
.submenu-box{width:min(440px,100%);background:#172033;border:1px solid #475569;border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.submenu-title{text-align:center;font-size:21px;font-weight:bold;margin-bottom:12px}
.submenu-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.submenu-options button{min-height:72px;font-size:18px}
.submenu-cancel{width:100%;margin-top:10px;background:#475569}

</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">

</head>
<body><div class="wrap">
<div class="card">
<h1>⚽ SCOUT AO VIVO</h1>
<div class="teams"><input id="home" value="Rio Claro"><div class="score"><span id="hs">0</span> × <span id="as">0</span></div><input id="away" value="Adversário"></div>
<div class="clock" id="clock">00:00</div><div class="period" id="period">1º TEMPO</div>
<div class="controls" style="margin-top:10px">
<button class="green" data-action="start">▶ INICIAR</button><button data-action="pause">⏸ PAUSAR</button>
<button class="blue" data-action="nextPeriod">2º TEMPO</button><button data-action="resetClock">↺ ZERAR</button>
</div></div>

<div class="card"><div class="events">
<button class="event green" data-action="add" data-type="Recuperação">🟢 RECUPERAÇÃO</button>
<button class="event red" data-action="add" data-type="Perda">🔴 PERDA</button>
<button class="event blue" data-action="submenu" data-type="Finalização" data-options="Fora|No alvo">⚽ FINALIZAÇÃO</button>
<button class="event blue" data-action="add" data-type="Passe-chave">🎯 PASSE-CHAVE</button>
<button class="event green" data-action="add" data-type="Transição ofensiva">⬆ TRANS. OFENSIVA</button>
<button class="event red" data-action="add" data-type="Transição defensiva">⬇ TRANS. DEFENSIVA</button>
<button class="event amber" data-action="submenu" data-type="Escanteio" data-options="A favor|Contra">🚩 ESCANTEIO</button>
<button class="event amber" data-action="submenu" data-type="Falta" data-options="A favor|Contra">🟨 FALTA</button>
<button class="event blue" data-action="submenu" data-type="Saída de bola" data-options="Curta|Longa">⚽ SAÍDA DE BOLA</button>
<button class="event red" data-action="add" data-type="Erro defensivo">⚠ ERRO DEFENSIVO</button>
<button class="event goal" style="grid-column:1/-1" data-action="goal">⚽ GOL</button>
</div></div>

<div class="card"><b>CONTADORES</b><div id="stats" class="stats" style="margin-top:8px"></div></div>
<div class="card"><b>ÚLTIMOS EVENTOS</b><div id="history" class="history"><div class="small" style="padding:8px">Nenhum evento registrado.</div></div></div>
<div class="footer">
<button data-action="undo">↶ DESFAZER</button><button class="blue" data-action="downloadCSV">💾 EXPORTAR CSV</button><button id="clearBtn" data-action="clearAll">🗑 LIMPAR</button>
</div>

<div id="compatStatus" class="small" style="text-align:center;margin:8px 0;padding:8px;border:1px solid #334155;border-radius:8px">
Carregando controles…
</div>
<div class="small" style="text-align:center;margin:10px">Os dados ficam neste navegador até você limpar o scout.</div>
</div>

<div id="submenuOverlay" class="submenu-overlay" >
  <div class="submenu-box">
    <div id="submenuTitle" class="submenu-title">Selecionar</div>
    <div id="submenuOptions" class="submenu-options"></div>
    <button class="submenu-cancel" data-action="closeSubmenu">CANCELAR</button>
  </div>
</div>

<script>
let seconds=0,timer=null,period=1,events=[];
const types=['Recuperação','Perda','Finalização','Passe-chave','Transição ofensiva','Transição defensiva','Escanteio','Falta','Saída de bola','Erro defensivo','Gol'];
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderClock(){document.getElementById('clock').textContent=fmt(seconds);document.getElementById('period').textContent=period+'º TEMPO'}
function start(){if(!timer)timer=setInterval(()=>{seconds++;renderClock()},1000)}
function pause(){clearInterval(timer);timer=null}
function resetClock(){pause();seconds=0;renderClock()}
function nextPeriod(){pause();period=2;seconds=0;renderClock()}
function add(type,detail=''){
  const homeEl=document.getElementById('home');
  events.push({
    tempo:fmt(seconds),
    periodo:period+'ºT',
    evento:type,
    detalhe:detail,
    equipe:homeEl.value||'Equipe'
  });
  save();
  render();
}

let submenuType='';
function openSubmenu(type,options){
  submenuType=type;
  document.getElementById('submenuTitle').textContent=type;
  const box=document.getElementById('submenuOptions');
  box.innerHTML='';
  options.forEach(opt=>{
    const b=document.createElement('button');
    b.textContent=opt;
    b.className= type==='Finalização'
      ? (opt==='No alvo' ? 'green' : 'red')
      : (opt==='A favor' ? 'green' : 'red');
    b.dataset.action='suboption'; b.dataset.option=opt;
    box.appendChild(b);
  });
  document.getElementById('submenuOverlay').style.display='flex';
}
function selectSubmenu(option){
  add(submenuType,option);
  closeSubmenu();
}
function closeSubmenu(){
  document.getElementById('submenuOverlay').style.display='none';
  submenuType='';
}
function overlayClose(e){
  if(e.target.id==='submenuOverlay') closeSubmenu();
}

function goal(){add('Gol');const hsEl=document.getElementById('hs');hsEl.textContent=Number(hsEl.textContent)+1;save();render()}
function undo(){if(events.length){let e=events.pop();const hsEl=document.getElementById('hs');if(e.evento==='Gol')hsEl.textContent=Math.max(0,Number(hsEl.textContent)-1);save();render()}}
let clearArmed=false, clearTimer=null;
function clearAll(){
  const btn=document.getElementById('clearBtn');
  if(!clearArmed){
    clearArmed=true;
    btn.textContent='⚠ TOQUE NOVAMENTE';
    btn.style.background='#dc2626';
    clearTimer=setTimeout(()=>{
      clearArmed=false;
      btn.textContent='🗑 LIMPAR';
      btn.style.background='';
    },3000);
    return;
  }
  clearTimeout(clearTimer);
  pause();
  events=[];
  seconds=0;
  period=1;
  document.getElementById('hs').textContent='0';
  document.getElementById('as').textContent='0';
  localStorage.removeItem('scoutEvents');
  localStorage.removeItem('scoutScore');
  renderClock();
  render();
  clearArmed=false;
  btn.textContent='🗑 LIMPAR';
  btn.style.background='';
}
function render(){
let c={};types.forEach(t=>c[t]=0);events.forEach(e=>c[e.evento]=(c[e.evento]||0)+1);
const statsEl=document.getElementById('stats');
const historyEl=document.getElementById('history');
statsEl.innerHTML=types.map(t=>`<div class="stat"><b>${c[t]}</b>${t}</div>`).join('');
historyEl.innerHTML=events.length
? events.slice().reverse().map(e=>`<div class="row"><b>${e.tempo}</b> · ${e.periodo} · ${e.evento}${e.detalhe?` <b>(${e.detalhe})</b>`:''}<br><span class="small">${e.equipe}</span></div>`).join('')
: '<div class="small" style="padding:8px">Nenhum evento registrado.</div>';
}
function save(){localStorage.setItem('scoutEvents',JSON.stringify(events));localStorage.setItem('scoutScore',document.getElementById('hs').textContent)}
function load(){try{events=JSON.parse(localStorage.getItem('scoutEvents'))||[];document.getElementById('hs').textContent=localStorage.getItem('scoutScore')||0}catch(e){}render()}
function downloadCSV(){let rows=[['Tempo','Periodo','Evento','Detalhe','Equipe'],...events.map(e=>[e.tempo,e.periodo,e.evento,e.detalhe||'',e.equipe])];
let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='scout_'+(document.getElementById('home').value||'equipe').replace(/\s+/g,'_')+'.csv';a.click()}

function handleAction(el){
  const action=el.dataset.action;
  if(!action) return;
  if(action==='start') start();
  else if(action==='pause') pause();
  else if(action==='nextPeriod') nextPeriod();
  else if(action==='resetClock') resetClock();
  else if(action==='undo') undo();
  else if(action==='downloadCSV') downloadCSV();
  else if(action==='clearAll') clearAll();
  else if(action==='goal') goal();
  else if(action==='add') add(el.dataset.type);
  else if(action==='submenu'){
    const opts=(el.dataset.options||'').split('|').filter(Boolean);
    openSubmenu(el.dataset.type,opts);
  }
  else if(action==='suboption') selectSubmenu(el.dataset.option);
  else if(action==='closeSubmenu') closeSubmenu();
}

let lastTap=0;
document.addEventListener('pointerup',function(e){
  const el=e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  lastTap=Date.now();
  handleAction(el);
},{passive:false});

document.addEventListener('click',function(e){
  if(Date.now()-lastTap<500) return;
  const el=e.target.closest('[data-action]');
  if(!el) return;
  e.preventDefault();
  handleAction(el);
});

document.getElementById('submenuOverlay').addEventListener('pointerup',function(e){
  if(e.target.id==='submenuOverlay') closeSubmenu();
});

window.addEventListener('load',()=>{
  const s=document.getElementById('compatStatus');
  s.textContent='✅ Controles carregados — toque em INICIAR para testar.';
});

load();renderClock();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW:', err));
  });
}
</script>

</body></html>
